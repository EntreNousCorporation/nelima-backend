<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Nelima — code temporaire</title>
</head>
<body style="margin:0; padding:0; background-color:#EEF2F9;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#EEF2F9;">
    <tr>
        <td align="center" style="padding:32px 16px;">
            <table role="presentation" cellpadding="0" cellspacing="0" style="max-width:560px; width:100%;">
                <tr>
                    <td align="center" style="padding-bottom:20px;">
                        <span style="font-family:Arial,Helvetica,sans-serif; font-size:30px; font-weight:bold; color:#0061FF; letter-spacing:0.5px;">Nelima</span>
                    </td>
                </tr>
                <tr>
                    <td style="background-color:#ffffff; border-radius:16px; padding:32px;">
                        <h1 style="margin:0 0 16px 0; font-family:Arial,Helvetica,sans-serif; font-size:20px; font-weight:bold; color:#0C285D;">
                            Votre code temporaire
                        </h1>
                        <div style="font-family:Arial,Helvetica,sans-serif; font-size:15px; line-height:1.6; color:#3F4A5A;">
                            Votre demande de code temporaire sur
                            <a target="_blank" th:href="@{${platformAddress}}" style="color:#0061FF; text-decoration:none;"><span th:utext="${platformDomain}">nelima.ci</span></a>
                            a bien été prise en compte. Utilisez ce code pour poursuivre votre action.
                        </div>
                        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:20px 0 8px 0;">
                            <tr>
                                <td style="background-color:#EAF1FF; border:1px solid #CFE0FF; border-radius:12px; padding:16px 28px;">
                                    <span style="font-family:Arial,Helvetica,sans-serif; font-size:30px; font-weight:bold; letter-spacing:6px; color:#0061FF;" th:utext="${otp}">000000</span>
                                </td>
                            </tr>
                        </table>
                        <p style="margin:0; font-family:Arial,Helvetica,sans-serif; font-size:13px; color:#8A99AD;">
                            Valable <strong style="color:#3F4A5A;" th:utext="${otp_validity}">10</strong> minutes.
                        </p>
                        <p style="margin:24px 0 0 0; font-family:Arial,Helvetica,sans-serif; font-size:15px; color:#3F4A5A;">
                            Cordialement,<br/><strong style="color:#0C285D;">L'équipe Nelima</strong>
                        </p>
                    </td>
                </tr>
                <tr>
                    <td align="center" style="padding:20px 16px;">
                        <p style="margin:0; font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:1.5; color:#8A99AD;">
                            Vous n'êtes pas à l'origine de cette demande ? Ignorez ce message.<br/>
                            Nelima · <a target="_blank" th:href="@{${platformAddress}}" style="color:#0061FF; text-decoration:none;"><span th:utext="${platformDomain}">nelima.ci</span></a>
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
