<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta content="text/html; charset=us-ascii" http-equiv="Content-Type">
</head>
<body>
<table align="center" style="background-color: #edf2f9; width: 100%;">
    <tr>
        <td>
            <table align="center" cellspacing="20"
                   style="background-color: white; max-width: 700px; padding: 30px; border-radius: 5px;">
                <tr>
                    <td style="color: #0B2E66; font-family: Roboto, Arial, sans-serif; font-size: 20px; font-weight: bold;">
                        Suggestion d&apos;un parent
                    </td>
                </tr>
                <tr>
                    <td style="font-family: Roboto, Arial, sans-serif; color: #576476; font-size: 15px;">
                        <p style="margin: 0 0 14px 0;">
                            <strong>De :</strong> <span th:text="${authorName}">&nbsp;</span>
                        </p>
                        <p style="margin: 0 0 14px 0;" th:if="${appVersion}">
                            <strong>Version de l&apos;application :</strong>
                            <span th:text="${appVersion}">&nbsp;</span>
                        </p>
                        <p style="margin: 0 0 6px 0;"><strong>Message :</strong></p>
                        <p style="margin: 0; padding: 14px; background-color: #f6f8fc; border-radius: 5px; white-space: pre-wrap;"
                           th:text="${message}">&nbsp;</p>
                    </td>
                </tr>
                <tr>
                    <td style="font-family: Roboto, Arial, sans-serif; color: #97a1af; font-size: 13px;">
                        Ce retour est aussi enregistr&eacute; dans la table <em>feedback</em> : il reste
                        relisible m&ecirc;me si ce courriel se perd.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
