springdoc:
  api-docs:
    enabled: true
  packages-to-scan:
    - com.ypyit.neoelima
  swagger-ui:
    disable-swagger-default-url: true
    display-request-duration: true

spring:
  application:
    name: nelima-backend
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:username}
    password: ${DB_PASSWORD:password}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      max-lifetime: 1200000
      validation-timeout: 300000
      maximum-pool-size: 10
      pool-name: NelimaConnectionPool
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nelima_db}
  data:
    redis:
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      host: ${REDIS_HOST:localhost}
      timeout: 6000
      repositories:
        enabled: false
  # Les migrations Nelima sont pilotées par FlywayConfiguration et non par l'autoconfiguration
  # Spring Boot, que le bean Flyway de PaySwitch désactive. Voir FlywayConfiguration.
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        enable_lazy_load_no_trans: true
        event:
          merge:
            entity_copy_observer: allow
    # Le schéma est piloté par Flyway. Ne jamais repasser en `update` :
    # `validate` échoue au démarrage si une entité diverge d'une migration.
    hibernate:
      ddl-auto: validate
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  mail:
    properties:
      from: no-reply@ypy-it.com
      mail:
        smtp:
          starttls:
            enable: true
          timeout: 60000
          auth: true
          ssl:
            enable: true
          connectiontimeout: 60000
          writetimeout: 60000
    host: ${SMTP_HOST:localhost}
    username: ${SMTP_USERNAME:username}
    password: ${SMTP_PASSWORD:password}
    port: ${SMTP_PORT:25}

# Security cfg
security:
  jwt:
    # Clé HMAC-SHA256 : 32 caractères minimum, jamais de valeur par défaut en production.
    secret: ${JWT_SECRET:dev-only-secret-change-me-32-chars-min}
    expiration-date: 86400000
    token-prefix: Bearer
    header-value: Authorization
    issuer: ${JWT_ISSUER:nelima}
server:
  forward-headers-strategy: framework
  port: ${SERVER_PORT:8082}

nelima:
  initialize-data: ${INITIALIZE_DATA:true}
  default-admin-pwd: ${DEFAULT_ADMIN_PWD:Api@2024}
  web-client-timeout: 1
  billing:
    # Commission YPYit sur les encaissements en ligne, exprimée en fraction.
    # Elle s'ajoute au montant de la tranche et est affichée au parent avant paiement.
    # Aucune commission sur les encaissements au guichet.
    commission-rate: ${COMMISSION_RATE:0.02}
    currency: XOF
    # Destination du parent après le tunnel de paiement de l'agrégateur.
    # Sur mobile ce sont des liens profonds, pas des URLs web.
    payment-success-url: ${PAYMENT_SUCCESS_URL:https://app.nelima.ci/paiement/succes}
    payment-error-url: ${PAYMENT_ERROR_URL:https://app.nelima.ci/paiement/echec}

payswitch:
  public-base-url: ${PAYSWITCH_PUBLIC_BASE_URL:https://api.nelima.ci}
  jeko:
    # Jeko exige toujours un canal de paiement, soit ici, soit à chaque transaction.
    default-payment-method: ${JEKO_DEFAULT_PAYMENT_METHOD:wave}
    environment: ${JEKO_ENVIRONMENT:SANDBOX}
    api-key: ${JEKO_API_KEY:}
    api-key-id: ${JEKO_API_KEY_ID:}
    webhook-secret: ${JEKO_WEBHOOK_SECRET:}
    store-id: ${JEKO_STORE_ID:}
    # 100 : Jeko impose un `amountCents` multiple de 100, ce qui établit que le champ est en
    # centimes de franc. Un facteur de 1 fait rejeter la transaction (`not_multiple_of_100`).
    amount-multiplier: ${JEKO_AMOUNT_MULTIPLIER:100}

main-domain: ${MAIN_DOMAIN:ypyit.com}

email-config:
  support-email: info@ypy-it.com
  platform-name: Nelima
  platform-address: https://${main-domain}
  email-from: info@ypy-it.com
  reset-password-uri: connexion/reset
  reset-password-admin-url: https://oauthdebugger.com/
  reset-password-partner-url: https://oauthdebugger.com/

storage:
  bucket-name: bucketName
  url: localhost:9000
  api-key: apiKey
  api-secret: apiSecret

sms:
  base-url: https://api.orange.com
  token-uri: oauth/v3/token
  username: username
  password: password
  send-uri: smsmessaging/v1/outbound/tel:+2250000/requests

management:
  health:
    mail:
      enabled: false